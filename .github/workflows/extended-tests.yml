name: Extended tests (manual)

# Slower suites that are not part of every pull request: the real-browser release scenarios and the centre-events SQL
# tests. Run from the Actions tab when a change touches them. Known baseline issues are recorded in AGENTS.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  centre-events:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:centre-events

  browser-acceptance:
    # Pinned: Playwright's browser installer does not support the newer ubuntu-latest image yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:attendance:browser
        env:
          MASS_TEST_MULTI_ROLE: '1'
          MASS_ATTENDANCE_SCREENSHOTS: test-results/frontend-acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-frontend-acceptance
          path: test-results/frontend-acceptance
          if-no-files-found: ignore
