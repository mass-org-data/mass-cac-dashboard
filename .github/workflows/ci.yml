name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run web:typecheck
      - run: npm run test:web
      - run: MASS_NEXT_UI=1 npm run build
      - run: npm audit --audit-level=high

  portable-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:sql:portable
      - run: npm run test:attendance
      - run: npm run test:staff-access
      - run: npm run test:centre-events

  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:attendance:browser
        env:
          MASS_TEST_MULTI_ROLE: '1'
          MASS_ATTENDANCE_SCREENSHOTS: test-results/frontend-acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-frontend-acceptance
          path: test-results/frontend-acceptance
          if-no-files-found: ignore
